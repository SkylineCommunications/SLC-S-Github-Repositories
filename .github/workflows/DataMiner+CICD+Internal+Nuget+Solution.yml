name: DataMiner CICD NuGet Solution
on:
  push:
    branches:
      - main
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9a-zA-Z]+'
  workflow_dispatch:
jobs:
  CICD:
    uses: SkylineCommunications/_ReusableWorkflows/.github/workflows/Master Workflow.yml@main
    with:
      sonarcloud-project-name: SkylineCommunications_SLC-S-Github-Repositories-Core
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGETAPIKEY_GITHUB }}